services:
  bank-core:
    build: ../bank-core
    container_name: bank-core
    ports:
      - "8100:8100"
    volumes:
      - bank-data:/app/data
    environment:
      - DB_PATH=/app/data/bank.db

  agent-service:
    build: ../agent-service
    container_name: agent-service
    ports:
      - "8200:8200"
    volumes:
      - agent-data:/app/data
    environment:
      - BANK_CORE_URL=http://bank-core:8100
      - LLM_PROVIDER=${LLM_PROVIDER:-deepseek}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
    depends_on:
      - bank-core

  web-app:
    build: ../web-app
    container_name: web-app
    ports:
      - "8080:80"
    depends_on:
      - agent-service

volumes:
  bank-data:
  agent-data:
