<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>智银 · 模拟 IM（M3#8 渠道降级）</title>
<style>
  body { background:#0b0b0d; color:#e6e6e6; font-family:"PingFang SC","Microsoft YaHei",sans-serif; margin:0; padding:24px 12px; }
  #phone { width:390px; max-width:96vw; margin:0 auto; border:1px solid #2a2a2e; border-radius:22px; background:#141414; overflow:hidden; }
  #head { padding:12px 16px; border-bottom:1px solid #2a2a2e; color:#d4af37; font-weight:600; font-size:14px; }
  #head small { display:block; color:#71717a; font-weight:400; font-size:11px; margin-top:2px; }
  #log { height:480px; overflow-y:auto; padding:14px 12px; display:flex; flex-direction:column; gap:8px; }
  .b { max-width:88%; padding:8px 12px; border-radius:12px; font-size:13px; line-height:1.7; white-space:pre-wrap; }
  .me { align-self:flex-end; background:#d4af37; color:#141414; }
  .bot { align-self:flex-start; background:#1c1c1e; border:1px solid #2a2a2e; }
  .bot.ok { border-left:3px solid #4ade80; }
  .bot.warn { border-left:3px solid #f87171; }
  #bar { display:flex; gap:8px; padding:10px 12px 16px; }
  #text { flex:1; padding:10px 12px; border-radius:10px; border:1px solid #3f3f46; background:#1c1c1e; color:#e6e6e6; font-size:13px; }
  button { padding:0 16px; border-radius:10px; border:1px solid #d4af37; background:#d4af37; color:#141414; font-weight:600; }
  #hint { padding:0 16px 12px; color:#71717a; font-size:11px; }
</style>
</head>
<body>
<div id="phone">
  <div id="head">智银 IM 客服<small>非流式降级通道 · 同一 Agent 同一 trace · 红操作仍需短信码</small></div>
  <div id="log"></div>
  <div id="bar"><input id="text" placeholder="试试：给赵敏转 200 / 回复 1 确认 / 直接输 6 位码" autofocus><button onclick="send()">发送</button></div>
  <div id="hint">确认卡回复 1=确认 / 2=取消；MFA 直接回复 6 位短信码；trace 随审批文本下发，可跳审计回放。</div>
</div>
<script>
const sid = "s_im_" + Math.floor(Math.random() * 1000);
const log = document.getElementById("log");
function bubble(text, me, cls) { const d = document.createElement("div"); d.className = "b " + (me ? "me" : "bot " + (cls || "")); d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight; }
async function send() {
  const t = document.getElementById("text"); const v = t.value.trim(); if (!v) return;
  bubble(v, true); t.value = "";
  const r = await fetch("/api/im/webhook", { method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ session_id: sid, text: v }) });
  const out = await r.json();
  (out.replies || []).forEach(x => bubble(x, false, /失败|锁定/.test(x) ? "warn" : (/回执|成功|已/.test(x) ? "ok" : "")));
}
document.getElementById("text").addEventListener("keydown", e => { if (e.key === "Enter") send(); });
bubble("您好，我是智银 IM 客服。试试「给赵敏转 200」。", false);
</script>
</body>
</html>
